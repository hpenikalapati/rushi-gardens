<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rushi Gardens - Admin Dashboard</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Login Screen Styling */
    .login-box {
      max-width: 360px;
      margin: 4rem auto;
      padding: 2rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      margin-top: 10px;
    }
    .error-msg {
      color: #e53e3e;
      font-size: 0.9em;
      margin-top: 10px;
    }

    /* Dashboard Styling */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .logo-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      height: 44px !important;
      width: 44px !important;
      object-fit: contain;
    }
    .btn-logout {
      background-color: #718096;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-logout:hover { background-color: #4a5568; }

    /* Tabs & Tables */
    .tab-btn { background: #e2e8f0; color: #2d3748; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px 4px 0 0; }
    .tab-btn.active { background: #2f855a; color: white; font-weight: bold; }
    .tab-content { display: none; margin-top: 20px; }
    .tab-content.active { display: block; }
    .order-card { border: 1px solid #cbd5e0; padding: 15px; margin-bottom: 15px; border-radius: 6px; background: #f8fafc; }
    
    /* Action Buttons */
    .btn-update { background-color: #2f855a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-update:hover { background-color: #276749; }
    .btn-delete { background-color: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 6px; }
    .btn-delete:hover { background-color: #c53030; }
  </style>
</head>
<body>

  <!-- LOGIN / REGISTER SECTION (Visible when signed out) -->
  <div id="loginSection" class="login-box">
    <img src="logo.png" alt="Rushi Gardens Logo" style="height: 55px; width: auto; margin-bottom: 10px;">
    <h2 id="authTitle">Seller Login</h2>
    <p id="authSubtitle" style="font-size: 0.9em; color: #4a5568;">Sign in to manage Rushi Gardens</p>
    
    <form id="loginForm">
      <input type="email" id="adminEmail" placeholder="Admin Email" required>
      <input type="password" id="adminPassword" placeholder="Password" required>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <p style="margin-top: 15px; font-size: 0.9em;">
      <a href="#" id="toggleAuthMode" style="color: #2f855a; text-decoration: underline;">Who are you?</a>
    </p>
    <p id="loginError" class="error-msg"></p>
  </div>

  <!-- DASHBOARD SECTION (Hidden until authenticated) -->
  <div id="dashboardSection" style="display: none;">
    <div class="dashboard-header">
      <div class="logo-header">
        <img src="logo.png" alt="Rushi Gardens Logo" class="header-logo">
        <h1 style="margin: 0;">Seller Dashboard</h1>
      </div>
      <button class="btn-logout" onclick="logoutAdmin()">Sign Out</button>
    </div>

    <div>
      <button class="tab-btn active" onclick="switchTab('ordersTab', this)">📦 Order Summaries</button>
      <button class="tab-btn" onclick="switchTab('inventoryTab', this)">🥦 Manage Inventory</button>
    </div>

    <!-- ORDER SUMMARY SECTION -->
    <div id="ordersTab" class="tab-content active">
      <h2>Customer Order History</h2>
      <div id="orderList">Loading order history...</div>
    </div>

    <!-- INVENTORY MANAGEMENT SECTION -->
    <div id="inventoryTab" class="tab-content">
      <h2>Produce Catalog</h2>
      <table border="1" cellpadding="8" style="width: 100%; text-align: left; border-collapse: collapse;">
        <thead>
          <tr style="background-color: #edf2f7;">
            <th>Produce</th>
            <th>Price ($)</th>
            <th>Image Path / URL</th>
            <th>In Stock?</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminInventory"></tbody>
      </table>

      <h3 style="margin-top: 2rem;">Add New Produce Item</h3>
      <input type="text" id="addName" placeholder="Item Name (e.g. Guava)">
      <input type="number" id="addPrice" step="0.01" placeholder="Price">
      <input type="text" id="addImage" placeholder="Image path (e.g. images/guava.jpg)">
      <button onclick="addNewProduct()" style="background-color: #2b6cb0;" class="btn-primary">Add Produce</button>
    </div>
  </div>

  <!-- Firebase SDKs (App, Firestore, and Auth) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCzHvC09ahmaO2Btw7ofjyu4hhK2jh5sVI",
      authDomain: "rushi-gardens.firebaseapp.com",
      databaseURL: "https://rushi-gardens-default-rtdb.firebaseio.com",
      projectId: "rushi-gardens",
      storageBucket: "rushi-gardens.firebasestorage.app",
      messagingSenderId: "346604079812",
      appId: "1:346604079812:web:da377ab1e04d03f259d791",
      measurementId: "G-KZ7YDLDT2J"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Approved admin emails
    const APPROVED_ADMINS = [
      "rushigardens@gmail.com",
      "hansitapenikalapati@gmail.com",
      "acnettem@gmail.com",
      "lokspen@gmail.com",
      "rushitha.penikalapati@gmail.com"
    ];

    let unsubscribeOrders = null;
    let unsubscribeProducts = null;
    let isRegisterMode = false;

    // Toggle between "Sign In" and "Create Account" modes
    document.getElementById('toggleAuthMode').addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      document.getElementById('loginError').innerText = '';

      if (isRegisterMode) {
        document.getElementById('authTitle').innerText = 'Create Admin Account';
        document.getElementById('authSubtitle').innerText = 'Register an approved Rushi Gardens email';
        document.getElementById('loginBtn').innerText = 'Register & Sign In';
        document.getElementById('toggleAuthMode').innerText = 'Already have an account? Sign In';
      } else {
        document.getElementById('authTitle').innerText = 'Seller Login';
        document.getElementById('authSubtitle').innerText = 'Sign in to manage Rushi Gardens';
        document.getElementById('loginBtn').innerText = 'Sign In';
        document.getElementById('toggleAuthMode').innerText = 'First time here? Create an admin account';
      }
    });

    // Monitor Authentication State
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        startDashboardListeners();
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
        if (unsubscribeOrders) unsubscribeOrders();
        if (unsubscribeProducts) unsubscribeProducts();
      }
    });

    // Handle Login or Registration Form Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim().toLowerCase();
      const password = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      errorEl.innerText = '';

      if (!APPROVED_ADMINS.includes(email)) {
        errorEl.innerText = 'This email is not authorized as a Rushi Gardens admin.';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = isRegisterMode ? 'Creating account...' : 'Signing in...';

      try {
        if (isRegisterMode) {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
          errorEl.innerText = 'An account with this email already exists. Switch to Sign In.';
        } else if (err.code === 'auth/weak-password') {
          errorEl.innerText = 'Password must be at least 6 characters long.';
        } else {
          errorEl.innerText = 'Invalid email or password. Please try again.';
        }
        console.error('Auth error:', err);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = isRegisterMode ? 'Register & Sign In' : 'Sign In';
      }
    });

    // Handle Sign Out
    function logoutAdmin() {
      auth.signOut();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Start Firestore Listeners ONLY After Admin Authenticates
    function startDashboardListeners() {
      // 1. Load Live Orders Summary
      unsubscribeOrders = db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        const list = document.getElementById('orderList');
        list.innerHTML = '';
        if (snapshot.empty) {
          list.innerHTML = '<p>No orders placed yet.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const o = doc.data();
          const date = o.timestamp ? new Date(o.timestamp.toDate()).toLocaleString() : 'Just now';
          
          let itemDetailsHtml = '<ul>';
          o.items.forEach(i => {
            const quantityText = i.qty ? `${i.qty} ${i.unit}` : `${i.lbs} lbs`;
            itemDetailsHtml += `<li>${i.name}: <strong>${quantityText}</strong> ($${i.subtotal.toFixed(2)})</li>`;
          });
          itemDetailsHtml += '</ul>';

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <h3>Order #${doc.id.substring(0, 6)} — <span style="color:#2f855a;">$${o.totalAmount.toFixed(2)}</span></h3>
            <p><strong>Date:</strong> ${date}</p>
            <p><strong>Customer:</strong> ${o.customerName} | <strong>Phone:</strong> ${o.customerPhone} | <strong>Email:</strong> ${o.customerEmail}</p>
            <h4>Items Ordered:</h4>
            ${itemDetailsHtml}
          `;
          list.appendChild(card);
        });
      }, err => {
        document.getElementById('orderList').innerHTML = `<p style="color:red;">Access denied: ${err.message}</p>`;
      });

      // 2. Load Live Inventory Management
      unsubscribeProducts = db.collection('products').orderBy('name', 'asc').onSnapshot(snapshot => {
        const tbody = document.getElementById('adminInventory');
        tbody.innerHTML = '';
        snapshot.forEach(doc => {
          const p = doc.data();
          const imgVal = p.imageUrl || '';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${p.name}</strong></td>
            <td><input type="number" step="0.01" value="${p.pricePerLb}" id="price-${doc.id}" style="width: 75px;"></td>
            <td><input type="text" value="${imgVal}" placeholder="images/item.jpg" id="img-${doc.id}" style="width: 150px;"></td>
            <td><input type="checkbox" ${p.inStock ? 'checked' : ''} id="stock-${doc.id}"></td>
            <td>
              <button class="btn-update" onclick="updateProduct('${doc.id}')">Update</button>
              <button class="btn-delete" onclick="deleteProduct('${doc.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }, err => {
        console.error("Products read error:", err);
      });

    // Update Price, Image, or In Stock status
    async function updateProduct(id) {
      const price = parseFloat(document.getElementById(`price-${id}`).value) || 0;
      const imageUrl = document.getElementById(`img-${id}`).value.trim();
      const inStock = document.getElementById(`stock-${id}`).checked;
      try {
        await db.collection('products').doc(id).update({ 
          pricePerLb: price, 
          imageUrl: imageUrl, 
          inStock: inStock 
        });
        alert('Product updated successfully!');
      } catch (err) {
        console.error("Error updating product:", err);
        alert('Failed to update product: ' + err.message);
      }
    }

    // Add a new product
    async function addNewProduct() {
      const name = document.getElementById('addName').value.trim();
      const price = parseFloat(document.getElementById('addPrice').value) || 0;
      const imageUrl = document.getElementById('addImage').value.trim();
      if (name) {
        try {
          await db.collection('products').add({ 
            name: name, 
            pricePerLb: price, 
            imageUrl: imageUrl, 
            inStock: true 
          });
          document.getElementById('addName').value = '';
          document.getElementById('addPrice').value = '';
          document.getElementById('addImage').value = '';
        } catch (err) {
          console.error("Error adding product:", err);
          alert('Failed to add product: ' + err.message);
        }
      } else {
        alert('Please enter a product name.');
      }
    }
  </script>
</body>
</html>
